<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Produção Multiplataforma - A-Frame VR</title>
  
  <!-- Google Fonts Import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- A-Frame VR Library -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- A-Frame Environment Component (Cenário Forest) -->
  <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>

  <style>
    /* Variáveis de Cores e Tipografia */
    :root {
      --color-primary: #FF00FF;      /* Magenta Neon */
      --color-secondary: #00FFFF;    /* Ciano Neon */
      --color-accent: #FFD700;       /* Ouro */
      --color-dark: #1E1E1E;         /* Escuro */
      --color-purple: #9400D3;       /* Roxo Violeta */

      --font-title: 'Lexend', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    h1, h2, h3, h4 { 
      font-family: var(--font-title); 
    }

    body, p, span, a, input, button { 
      font-family: var(--font-body); 
    }

    body {
      margin: 0;
      overflow: hidden;
    }

    /* Painel de Instruções Topo/Esquerda */
    #instructions {
      position: absolute;
      top: 15px;
      left: 15px;
      background: url('https://raw.githubusercontent.com/GlauberLASantiago/gl-cores-fontes-e-fundos/main/musica/17_realista_festival_multidao_luzes.png') center/cover no-repeat;
      color: #FFFFFF;
      padding: 16px 20px;
      border-radius: 12px;
      border: 2px solid var(--color-secondary);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), inset 0 0 20px rgba(30, 30, 30, 0.85);
      z-index: 999;
      pointer-events: none;
      max-width: 320px;
    }

    #instructions h3 {
      margin: 0 0 8px 0;
      color: var(--color-accent);
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #instructions p {
      margin: 4px 0;
      font-size: 0.85rem;
      line-height: 1.4;
      color: #E0E0E0;
    }

    /* Interface 2D (Dashboard / Caixa de Diálogo) */
    #ui-container {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 650px;
      /* Aplicação da Imagem de Fundo Solicitada com Overlay Escuro para Contraste */
      background: linear-gradient(rgba(30, 30, 30, 0.88), rgba(30, 30, 30, 0.95)), 
                  url('https://raw.githubusercontent.com/GlauberLASantiago/gl-cores-fontes-e-fundos/main/musica/17_realista_festival_multidao_luzes.png') center/cover no-repeat;
      color: #FFFFFF;
      padding: 20px 25px;
      border-radius: 16px;
      border: 2px solid var(--color-primary);
      text-align: left;
      box-shadow: 0 0 25px rgba(255, 0, 255, 0.5), 0 8px 32px rgba(0, 0, 0, 0.8);
      z-index: 999;
      display: none;
      backdrop-filter: blur(4px);
    }

    .ui-badge {
      display: inline-block;
      background-color: var(--color-purple);
      color: var(--color-accent);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 1px solid var(--color-accent);
    }

    #ui-title {
      font-size: 1.3rem;
      margin: 0 0 8px 0;
      color: var(--color-secondary);
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
    }

    #ui-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #F0F0F0;
      margin: 0;
    }
  </style>

  <script>
    // Sistema de Text-To-Speech (Sintetizador de Voz)
    const tts = {
      speak: function(text) {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel(); // Cancela falas anteriores
          
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'pt-BR';
          utterance.rate = 1.0;
          utterance.pitch = 1.0;
          
          window.speechSynthesis.speak(utterance);
        }
      },
      stop: function() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }
    };

    // Componente A-Frame de Proximidade e Interação
    AFRAME.registerComponent('interactive-zone', {
      schema: {
        category: {type: 'string', default: 'CONTEÚDO'},
        title: {type: 'string', default: ''},
        message: {type: 'string', default: ''},
        distance: {type: 'number', default: 3.5}
      },
      init: function () {
        this.cameraEl = document.querySelector('#camera');
        this.uiContainer = document.getElementById('ui-container');
        this.uiBadge = document.getElementById('ui-badge');
        this.uiTitle = document.getElementById('ui-title');
        this.uiText = document.getElementById('ui-text');
        this.inRange = false;
      },
      tick: function () {
        if (!this.cameraEl) return;

        const cameraPos = this.cameraEl.object3D.position;
        const objectPos = this.el.object3D.position;
        const dist = cameraPos.distanceTo(objectPos);

        // Se o usuário entra no raio de proximidade
        if (dist <= this.data.distance && !this.inRange) {
          this.inRange = true;
          this.activateZone();
        } 
        // Se o usuário sai do raio
        else if (dist > this.data.distance && this.inRange) {
          this.inRange = false;
          this.deactivateZone();
        }
      },
      activateZone: function () {
        this.uiBadge.innerText = this.data.category;
        this.uiTitle.innerText = this.data.title;
        this.uiText.innerText = this.data.message;
        this.uiContainer.style.display = 'block';

        tts.speak(this.data.message);
      },
      deactivateZone: function () {
        this.uiContainer.style.display = 'none';
        tts.stop();
      }
    });
  </script>
</head>
<body>

  <!-- Dashboard 2D / Instruções -->
  <div id="instructions">
    <h3>🚀 Produtividade Multiplataforma</h3>
    <p><b>Movimentação:</b> Teclas <b>WASD</b> ou <b>Setas</b>.</p>
    <p><b>Visão:</b> Clique e arraste o <b>Mouse</b>.</p>
    <p>Aproxime-se dos objetos e NPCs para interagir e ouvir as explicações!</p>
  </div>

  <!-- Dashboard 2D / Caixa de Diálogo de Proximidade -->
  <div id="ui-container">
    <span id="ui-badge" class="ui-badge">Categoria</span>
    <h2 id="ui-title">Título do Hub</h2>
    <p id="ui-text">Mensagem informativa sobre produção de conteúdo multiplataforma...</p>
  </div>

  <!-- Cenário 3D A-Frame -->
  <a-scene avatar-recorder>
    <!-- Ambiente Forest -->
    <a-entity environment="preset: forest; lighting: point; groundColor: #1a2e15; dressingAmount: 40; skyType: atmosphere"></a-entity>

    <!-- Câmera do Jogador -->
    <a-entity id="camera" camera look-controls wasd-controls position="0 1.6 0">
      <a-cursor color="#00FFFF" fuse="false"></a-cursor>
    </a-entity>

    <!-- Luzes de Acompanhamento no Estilo Neon -->
    <a-light type="ambient" color="#9400D3" intensity="0.5"></a-light>
    <a-light type="directional" color="#00FFFF" intensity="0.6" position="-2 4 2"></a-light>
    <a-light type="point" color="#FF00FF" intensity="0.8" position="0 3 -5"></a-light>

    <!-- ==================== NPCS E OBJETOS DE INTERAÇÃO ==================== -->

    <!-- NPC 1: Estrategista de Conteúdo -->
    <a-entity position="-3 0 -5" interactive-zone="
      category: Planejamento;
      title: 🧙‍♂️ Silas | Estrategista de Conteúdo;
      message: Bem-vindo! A produção multiplataforma exige adaptação. Não se trata de replicar o mesmo arquivo, mas de ajustar a mensagem, o tom e o formato para a linguagem nativa de cada rede.;
      distance: 3.5">
      <!-- NPC Visual -->
      <a-cylinder position="0 1 0" radius="0.4" height="1.5" color="#9400D3"></a-cylinder>
      <a-sphere position="0 2 0" radius="0.35" color="#FFD700"></a-sphere>
      <!-- Halo Neon -->
      <a-torus position="0 2.4 0" radius="0.4" radius-tubular="0.02" color="#00FFFF" rotation="90 0 0"></a-torus>
      <!-- Texto 3D Superior -->
      <a-text value="Silas (Estrategista)" position="0 2.8 0" align="center" side="double" color="#FFD700" scale="0.8 0.8 0.8"></a-text>
    </a-entity>

    <!-- OBJETO 1: Estúdio de Podcast & Áudio -->
    <a-entity position="4 0 -4" interactive-zone="
      category: Áudio & Podcast;
      title: 🎙️ Estúdio de Áudio Assíncrono;
      message: O formato áudio é altamente conveniente. Podcasts e audiobooks permitem a retenção da atenção do usuário enquanto ele realiza outras atividades cotidianas.;
      distance: 3">
      <!-- Mesa e Microfone -->
      <a-box position="0 0.5 0" width="1.6" height="0.9" depth="1" color="#1E1E1E"></a-box>
      <a-cylinder position="0 1.1 0" radius="0.04" height="0.4" color="#FF00FF"></a-cylinder>
      <a-sphere position="0 1.35 0" radius="0.12" color="#00FFFF"></a-sphere>
      <!-- Texto 3D Superior -->
      <a-text value="Podcast & Audio" position="0 1.8 0" align="center" side="double" color="#00FFFF" scale="0.8 0.8 0.8"></a-text>
    </a-entity>

    <!-- OBJETO 2: Totem de Redes Sociais -->
    <a-entity position="-5 0 -1" interactive-zone="
      category: Micro-conteúdo;
      title: 📱 Totem Social & Reels;
      message: Para dispositivos móveis, a rapidez é fundamental. Utilize ganchos fortes nos primeiros 3 segundos, vídeos verticais e legendas dinâmicas.;
      distance: 3">
      <!-- Smartphone/Totem Giant -->
      <a-box position="0 1.5 0" width="0.9" height="1.8" depth="0.1" color="#1E1E1E"></a-box>
      <a-plane position="0 1.5 0.06" width="0.8" height="1.6" color="#FF00FF"></a-plane>
      <!-- Texto 3D Superior -->
      <a-text value="Redes Sociais" position="0 2.6 0" align="center" side="double" color="#FF00FF" scale="0.8 0.8 0.8"></a-text>
    </a-entity>

    <!-- NPC 2: Produtora Transmídia -->
    <a-entity position="2 0 -8" interactive-zone="
      category: Vídeo & Transmídia;
      title: 👩‍🎥 Clara | Produtora Transmídia;
      message: Lembre-se: vídeos horizontais funcionam para YouTube e TV, enquanto vídeos verticais dominam os feeds mobile. Uma história transmídia se completa através de múltiplos canais.;
      distance: 3.5">
      <!-- NPC Visual -->
      <a-cylinder position="0 1 0" radius="0.4" height="1.5" color="#FF00FF"></a-cylinder>
      <a-sphere position="0 2 0" radius="0.35" color="#00FFFF"></a-sphere>
      <a-box position="0.4 1.2 0" width="0.3" height="0.3" depth="0.4" color="#1E1E1E"></a-box>
      <!-- Texto 3D Superior -->
      <a-text value="Clara (Vídeo Maker)" position="0 2.8 0" align="center" side="double" color="#FFD700" scale="0.8 0.8 0.8"></a-text>
    </a-entity>

    <!-- OBJETO 3: Central de Métricas e Analytics -->
    <a-entity position="0 0 -10" interactive-zone="
      category: Analytics & Dashboard;
      title: 📊 Central de Dados Multiplataforma;
      message: Acompanhe métricas em tempo real! Analise o engajamento, a taxa de retenção e o ROI em cada plataforma para otimizar continuamente sua estratégia de conteúdo.;
      distance: 3.5">
      <!-- Holograma/Pirâmide Neon -->
      <a-cone position="0 1.2 0" radius-bottom="0.8" height="1.2" color="#00FFFF" material="opacity: 0.7; transparent: true; wireframe: false"></a-cone>
      <a-octahedron position="0 1.2 0" radius="0.5" color="#FFD700" material="wireframe: true"></a-octahedron>
      <!-- Texto 3D Superior -->
      <a-text value="Analytics & Metrics" position="0 2.2 0" align="center" side="double" color="#00FFFF" scale="0.8 0.8 0.8"></a-text>
    </a-entity>

  </a-scene>

</body>
</html>

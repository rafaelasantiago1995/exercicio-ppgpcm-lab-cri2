<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Produção de Conteúdos Multiplataforma - Dashboard VR</title>
  
  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- A-Frame Environment Component (para o cenário 'forest') -->
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>

  <!-- Importação de Fuentes Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Regras de Tipografia e Variáveis CSS */
    :root {
      --font-title: 'Lexend', sans-serif;
      --font-body: 'Inter', sans-serif;
      
      --color-magenta: #FF00FF;
      --color-cyan: #00FFFF;
      --color-gold: #FFD700;
      --color-dark: #1E1E1E;
      --color-purple: #9400D3;
    }

    h1, h2, h3, h4 { 
      font-family: var(--font-title); 
    }
    
    body, p, span, a, input, button { 
      font-family: var(--font-body); 
    }

    body {
      margin: 0;
      padding: 0;
      background-image: linear-gradient(rgba(30, 30, 30, 0.4), rgba(30, 30, 30, 0.4)), 
                        url('https://raw.githubusercontent.com/GlauberLASantiago/gl-cores-fontes-e-fundos/main/musica/17_realista_festival_multidao_luzes.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* UI Overlay Estilo Produtividade & Dashboard */
    #ui-overlay {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 650px;
      background: rgba(30, 30, 30, 0.90);
      backdrop-filter: blur(8px);
      color: #FFFFFF;
      padding: 20px 25px;
      border-radius: 12px;
      box-shadow: 0 8px 32px 0 rgba(148, 0, 211, 0.37);
      border: 2px solid var(--color-cyan);
      display: none;
      z-index: 9999;
      transition: all 0.3s ease;
    }

    #ui-title {
      font-weight: 700;
      font-size: 1.3em;
      color: var(--color-gold);
      margin: 0 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--color-purple);
      padding-bottom: 5px;
    }

    #ui-text {
      font-weight: 400;
      font-size: 1em;
      line-height: 1.5;
      color: #E0E0E0;
      margin: 0;
    }

    /* Painel de Instruções Superior */
    #instructions {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(30, 30, 30, 0.85);
      backdrop-filter: blur(5px);
      color: #FFF;
      padding: 12px 16px;
      border-radius: 8px;
      border-left: 4px solid var(--color-magenta);
      z-index: 9999;
      pointer-events: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    #instructions h4 {
      margin: 0 0 5px 0;
      color: var(--color-cyan);
      font-size: 0.9em;
      text-transform: uppercase;
    }

    #instructions p {
      margin: 0;
      font-size: 0.8em;
      line-height: 1.4;
    }
  </style>

  <script>
    // Helper de Sintetização de Voz (TTS)
    const SpeakHelper = {
      speak: function(text) {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel(); // Parar falas em andamento
          
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'pt-BR';
          utterance.rate = 1.0;
          utterance.pitch = 1.0;

          window.speechSynthesis.speak(utterance);
        }
      },
      stop: function() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }
    };

    // Componente customizado A-Frame para detecção de proximidade
    AFRAME.registerComponent('proximity-trigger', {
      schema: {
        distance: { type: 'number', default: 3 },
        title: { type: 'string', default: '' },
        message: { type: 'string', default: '' }
      },
      init: function () {
        this.player = document.querySelector('#camera-rig');
        this.triggered = false;
        this.uiOverlay = document.getElementById('ui-overlay');
        this.uiTitle = document.getElementById('ui-title');
        this.uiText = document.getElementById('ui-text');
      },
      tick: function () {
        if (!this.player) return;

        const playerPos = new THREE.Vector3();
        const targetPos = new THREE.Vector3();
        
        this.player.object3D.getWorldPosition(playerPos);
        this.el.object3D.getWorldPosition(targetPos);

        const dist = playerPos.distanceTo(targetPos);

        if (dist < this.data.distance && !this.triggered) {
          this.triggered = true;
          this.activateTrigger();
        } 
        else if (dist >= this.data.distance + 0.5 && this.triggered) {
          this.triggered = false;
          this.deactivateTrigger();
        }
      },
      activateTrigger: function () {
        this.uiTitle.innerText = this.data.title;
        this.uiText.innerText = this.data.message;
        this.uiOverlay.style.display = 'block';

        SpeakHelper.speak(this.data.title + ". " + this.data.message);
      },
      deactivateTrigger: function () {
        this.uiOverlay.style.display = 'none';
        SpeakHelper.stop();
      }
    });
  </script>
</head>
<body>

  <!-- Instruções na Tela (Dashboard Style) -->
  <div id="instructions">
    <h4>Painel de Navegação</h4>
    <p>
      <b>Mover:</b> Teclas W, A, S, D ou Setas<br>
      <b>Olhar:</b> Arrastar o mouse<br>
      Aproxime-se dos hubs e NPCs para interagir.
    </p>
  </div>

  <!-- UI Overlay / Dashboard para Textos e TTS -->
  <div id="ui-overlay">
    <h3 id="ui-title">Módulo de Conteúdo</h3>
    <p id="ui-text">Aproxime-se de um ponto de interesse...</p>
  </div>

  <!-- Cena 3D A-Frame -->
  <a-scene radar>
    
    <!-- Cenário 'Forest' -->
    <a-entity environment="preset: forest; lighting: point; groundColor: #1E1E1E; dressingAmount: 70"></a-entity>

    <!-- Iluminação Colorida com a Paleta -->
    <a-light type="ambient" color="#FFFFFF" intensity="0.3"></a-light>
    <a-light type="directional" color="#00FFFF" intensity="0.6" position="-1 4 2"></a-light>
    <a-light type="point" color="#FF00FF" intensity="0.8" position="0 3 -2"></a-light>

    <!-- Jogador (Camera Rig) -->
    <a-entity id="camera-rig" position="0 0 5">
      <a-camera look-controls wasd-controls="acceleration: 20">
        <a-cursor color="#00FFFF" radius-inner="0.01" radius-outer="0.02"></a-cursor>
      </a-camera>
    </a-entity>

    <!-- ======================================================== -->
    <!-- ESTAÇÕES DE CONTEÚDO MULTIPLATAFORMA E NPCS              -->
    <!-- ======================================================== -->

    <!-- NPC 1: O Estrategista de Conteúdo (Início) -->
    <a-group position="0 0 1">
      <a-cylinder position="0 0.75 0" radius="0.3" height="1.5" color="#9400D3"></a-cylinder>
      <a-sphere position="0 1.75 0" radius="0.25" color="#FFD700"></a-sphere>
      <a-text value="Estrategista de Conteudo" position="0 2.2 0" align="center" scale="0.8 0.8 0.8" color="#00FFFF"></a-text>
      
      <a-entity proximity-trigger="
        distance: 2.5; 
        title: Estrategista de Conteudo; 
        message: Bem-vindo ao hub de producao multiplataforma! Um unico assunto central pode ser transformado em video, audio, texto e pílulas sociais. Adapte a mensagem e multiplique o seu alcance.">
      </a-entity>
    </a-group>


    <!-- Estação 1: VÍDEO (YouTube / Reels / TikTok) -->
    <a-group position="-5 0 -4">
      <a-box position="0 1 0" width="1.5" height="1" depth="0.1" color="#FF00FF"></a-box> 
      <a-cylinder position="0 0.4 0" radius="0.05" height="0.8" color="#1E1E1E"></a-cylinder>
      <a-box position="0 0 0" width="0.6" height="0.1" depth="0.6" color="#9400D3"></a-box>
      <a-triangle position="0 1 0.06" vertex-a="0 0.2 0" vertex-b="-0.15 -0.1 0" vertex-c="0.15 -0.1 0" rotation="0 0 -90" color="#00FFFF"></a-triangle>

      <a-text value="Modulo: Video" position="0 1.8 0" align="center" color="#FFD700"></a-text>

      <a-entity proximity-trigger="
        distance: 3; 
        title: Hub de Conteudo em Video; 
        message: O video e o formato âncora mais completo. Um conteudo longo em video pode ser fatiado em dezenas de cortes para Reels, TikTok e Shorts, gerando engajamento continuo.">
      </a-entity>
    </a-group>


    <!-- Estação 2: PODCAST / ÁUDIO (Spotify / Podcasts) -->
    <a-group position="5 0 -4">
      <a-cylinder position="0 1.2 0" radius="0.08" height="0.3" color="#00FFFF"></a-cylinder>
      <a-sphere position="0 1.35 0" radius="0.09" color="#FF00FF"></a-sphere> 
      <a-cylinder position="0 0.5 0" radius="0.02" height="1" color="#1E1E1E"></a-cylinder>
      <a-cylinder position="0 0 0" radius="0.2" height="0.05" color="#9400D3"></a-cylinder>

      <a-text value="Modulo: Audio & Podcast" position="0 1.8 0" align="center" color="#FFD700"></a-text>

      <a-entity proximity-trigger="
        distance: 3; 
        title: Hub de Podcasting; 
        message: Extraia a faixa de audio da sua gravacao principal para distribuir em agregadores de podcast. E a melhor maneira de impactar a audiencia em momentos de multitarefa.">
      </a-entity>
    </a-group>


    <!-- Estação 3: TEXTO / BLOG / E-BOOK -->
    <a-group position="-5 0 3">
      <a-box position="-0.3 0.8 0" width="0.5" height="0.05" depth="0.7" color="#00FFFF" rotation="0 0 -10"></a-box>
      <a-box position="0.3 0.8 0" width="0.5" height="0.05" depth="0.7" color="#00FFFF" rotation="0 0 10"></a-box>
      <a-box position="0 0.4 0" width="0.8" height="0.8" depth="0.5" color="#9400D3"></a-box>

      <a-text value="Modulo: Texto & SEO" position="0 1.8 0" align="center" color="#FFD700"></a-text>

      <a-entity proximity-trigger="
        distance: 3; 
        title: Hub de Texto e Artigos; 
        message: Converta as ideias da sua producao em artigos estruturados para blogs e newsletters. Conteudos escritos fortalecem sua autoridade organica em mecanismos de busca como o Google.">
      </a-entity>
    </a-group>


    <!-- NPC 2: Especialista em Redes Sociais -->
    <a-group position="5 0 3">
      <a-box position="-0.8 1 0" width="0.5" height="1" depth="0.05" color="#1E1E1E"></a-box>
      <a-box position="-0.8 1 0.03" width="0.45" height="0.9" depth="0.01" color="#FF00FF"></a-box>

      <a-cylinder position="0 0.75 0" radius="0.3" height="1.5" color="#00FFFF"></a-cylinder>
      <a-sphere position="0 1.75 0" radius="0.25" color="#FFD700"></a-sphere>
      
      <a-text value="Social Media Manager" position="-0.4 2.2 0" align="center" scale="0.8 0.8 0.8" color="#FF00FF"></a-text>

      <a-entity proximity-trigger="
        distance: 3; 
        title: Especialista em Redes Sociais; 
        message: Distribua o conhecimento em micro-conteudos! Crie carrosseis explicativos para o Instagram, threads estrategicas para o X e posts analiticos para o LinkedIn.">
      </a-entity>
    </a-group>

  </a-scene>

</body>
</html>
